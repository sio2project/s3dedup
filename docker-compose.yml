version: '3.8'

# Garage S3 and PostgreSQL setup for s3dedup development
# Just run: docker-compose up -d
# Fixed dev credentials are configured automatically (no manual setup needed).
services:
  garage:
    image: dxflrs/garage:v2.2.0
    container_name: s3dedup-garage
    restart: unless-stopped
    ports:
      - "3900:3900"   # S3 API
      - "3902:3902"   # Admin API
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    image: curlimages/curl:latest
    container_name: s3dedup-garage-init
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/init-garage.sh:/init-garage.sh:ro
    entrypoint: ["/bin/sh", "/init-garage.sh"]

  postgres:
    image: postgres:16-alpine
    container_name: s3dedup-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: s3dedup
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  garage_data:
    driver: local
  garage_meta:
    driver: local
  postgres_data:
    driver: local
