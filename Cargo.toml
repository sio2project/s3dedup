[package]
name = "s3dedup"
version = "1.2.1"
edition = "2024"

[lib]
name = "s3dedup"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.44.1", features = ["full"] }
axum = { version = "0.8.1", features = ["macros"] }
tower-http = { version = "0.6.2", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.3", features = ["postgres", "sqlite", "runtime-tokio"]}
log = "0.4.26"
chrono = "0.4.40"
aws-sdk-s3 = { version = "1.52.0", features = ["behavior-version-latest"] }
aws-config = { version = "1.5.0", features = ["behavior-version-latest"] }
sha2 = "0.10.8"
bytes = "1.5.0"
flate2 = "1.0.28"
urlencoding = "2.1.3"
clap = { version = "4.5.0", features = ["derive"] }
reqwest = { version = "0.12.0", features = ["json", "gzip", "native-tls-vendored"] }
prometheus = "0.13.4"
lazy_static = "1.5.0"
anyhow = "1.0.100"
parking_lot = { version = "0.12.4", features = ["arc_lock", "send_guard"] }
async-trait = "0.1.77"
futures-util = "0.3.31"
walkdir = "2.5.0"
rand = "0.9.2"

[dev-dependencies]
tempfile = "3.15.0"
