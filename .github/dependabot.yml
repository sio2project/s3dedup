version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Pinned to the SHA of the `stable` branch; Dependabot proposes the
      # newest commit across branches, which is `nightly` (see #57, #60).
      - dependency-name: dtolnay/rust-toolchain
