name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  S3_ACCESS_KEY: GK0123456789abcdef01234567
  S3_SECRET_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
  S3_ENDPOINT: http://localhost:3900

jobs:
  test:
    name: Test ${{ matrix.kvstorage }} + ${{ matrix.locks }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - kvstorage: sqlite
            locks: memory
          - kvstorage: postgres
            locks: memory
          - kvstorage: postgres
            locks: postgres

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: s3dedup_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Start Garage
      run: |
        mkdir -p /tmp/garage/meta /tmp/garage/data
        cat > /tmp/garage/garage.toml << 'EOF'
        metadata_dir = "/tmp/garage/meta"
        data_dir = "/tmp/garage/data"
        db_engine = "sqlite"
        replication_factor = 1
        rpc_bind_addr = "[::]:3901"
        rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

        [s3_api]
        s3_region = "garage"
        api_bind_addr = "[::]:3900"
        root_domain = ".s3.garage.localhost"

        [admin]
        api_bind_addr = "[::]:3902"
        admin_token = "s3dedup-test-admin-token"
        EOF

        docker run -d \
          --name garage \
          --network host \
          -v /tmp/garage/garage.toml:/etc/garage.toml:ro \
          -v /tmp/garage/meta:/tmp/garage/meta \
          -v /tmp/garage/data:/tmp/garage/data \
          dxflrs/garage:v2.2.0

        echo "Waiting for Garage admin API..."
        for i in {1..30}; do
          if curl -sf -o /dev/null -H "Authorization: Bearer s3dedup-test-admin-token" http://localhost:3902/v2/GetClusterStatus 2>/dev/null; then
            echo "Garage is ready!"
            break
          fi
          if [ "$i" = "30" ]; then
            echo "ERROR: Timeout waiting for Garage"
            docker logs garage
            exit 1
          fi
          sleep 1
        done

    - name: Initialize Garage
      run: |
        ADMIN_TOKEN="s3dedup-test-admin-token"
        ADMIN="http://localhost:3902"
        AUTH="Authorization: Bearer $ADMIN_TOKEN"

        # Get node ID
        NODE_ID=$(curl -sf -H "$AUTH" "$ADMIN/v2/GetClusterStatus" | jq -r '.nodes[0].id')
        echo "Node ID: $NODE_ID"

        # Configure and apply layout
        curl -sf -X POST \
          -H "$AUTH" \
          -H "Content-Type: application/json" \
          -d "{\"roles\":[{\"id\":\"$NODE_ID\",\"zone\":\"dc1\",\"capacity\":1073741824,\"tags\":[]}]}" \
          "$ADMIN/v2/UpdateClusterLayout"

        curl -sf -X POST \
          -H "$AUTH" \
          -H "Content-Type: application/json" \
          -d '{"version":1}' \
          "$ADMIN/v2/ApplyClusterLayout"

        sleep 2

        # Import fixed API key
        curl -sf -X POST \
          -H "$AUTH" \
          -H "Content-Type: application/json" \
          -d "{\"accessKeyId\":\"$S3_ACCESS_KEY\",\"secretAccessKey\":\"$S3_SECRET_KEY\",\"name\":\"s3dedup-key\"}" \
          "$ADMIN/v2/ImportKey"

        # Grant createBucket permission
        curl -sf -X POST \
          -H "$AUTH" \
          -H "Content-Type: application/json" \
          -d '{"allow":{"createBucket":true}}' \
          "$ADMIN/v2/UpdateKey?id=$S3_ACCESS_KEY"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Create db directory
      run: mkdir -p db

    - name: Run tests (SQLite)
      if: matrix.kvstorage == 'sqlite'
      run: cargo test --features test-mocks --verbose
      env:
        RUST_LOG: debug

    - name: Run tests (Postgres + Memory Locks)
      if: matrix.kvstorage == 'postgres' && matrix.locks == 'memory'
      run: cargo test --features test-mocks --verbose
      env:
        RUST_LOG: debug
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/s3dedup_test

    - name: Run tests (Postgres + Postgres Locks)
      if: matrix.kvstorage == 'postgres' && matrix.locks == 'postgres'
      run: cargo test --features test-mocks --verbose
      env:
        RUST_LOG: debug
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/s3dedup_test

    - name: Clean up test databases
      if: always()
      run: rm -rf db/test_*.db*
