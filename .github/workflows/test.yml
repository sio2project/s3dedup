name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.kvstorage }} + ${{ matrix.locks }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - kvstorage: sqlite
            locks: memory
          - kvstorage: postgres
            locks: memory

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: s3dedup_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
        # MinIO needs to be started with 'server' command
        command: server /data

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Create db directory
      run: mkdir -p db

    - name: Set up MinIO bucket
      run: |
        # Wait a bit for MinIO to be fully ready
        sleep 5
        # Install mc (MinIO client)
        wget https://dl.min.io/client/mc/release/linux-amd64/mc
        chmod +x mc
        ./mc alias set local http://localhost:9000 minioadmin minioadmin
        ./mc mb local/bucket1 || true

    - name: Run tests (SQLite)
      if: matrix.kvstorage == 'sqlite'
      run: cargo test --verbose
      env:
        RUST_LOG: debug

    - name: Run tests (Postgres)
      if: matrix.kvstorage == 'postgres'
      run: |
        # Create a test config for Postgres
        cat > config.test.json << EOF
        {
          "logging": {
            "level": "debug",
            "json": false
          },
          "buckets": [
            {
              "name": "bucket1",
              "address": "0.0.0.0",
              "port": 3000,
              "kvstorage_type": "postgres",
              "postgres": {
                "host": "localhost",
                "port": 5432,
                "user": "postgres",
                "password": "postgres",
                "dbname": "s3dedup_test",
                "pool_size": 10
              },
              "locks_type": "memory",
              "s3storage_type": "minio",
              "minio": {
                "endpoint": "http://localhost:9000",
                "access_key": "minioadmin",
                "secret_key": "minioadmin",
                "force_path_style": true
              }
            }
          ]
        }
        EOF

        # Run tests
        cargo test --verbose
      env:
        RUST_LOG: debug
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/s3dedup_test

    - name: Clean up test databases
      if: always()
      run: rm -rf db/test_*.db*
